<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13" />
      <stop offset="50%" stop-color="#0c1322" />
      <stop offset="100%" stop-color="#080e1a" />
    </linearGradient>

    <!-- Animated Neon Title Gradient -->
    <linearGradient id="neonTitle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF">
        <animate attributeName="stop-color" values="#00F5FF; #7928CA; #FF0080; #00FF9D; #00F5FF" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#38BDF8">
        <animate attributeName="stop-color" values="#38BDF8; #A855F7; #EC4899; #38BDF8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#818CF8">
        <animate attributeName="stop-color" values="#818CF8; #00FF9D; #00F5FF; #818CF8" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Animated Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF" stop-opacity="0.8">
        <animate attributeName="stop-opacity" values="0.8; 0.2; 0.8" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0.8">
        <animate attributeName="stop-opacity" values="0.2; 0.8; 0.2" dur="4s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Glowing Wave 1 Gradient -->
    <linearGradient id="wave1Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.2" />
    </linearGradient>

    <!-- Glowing Wave 2 Gradient -->
    <linearGradient id="wave2Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#EC4899" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#00FF9D" stop-opacity="0.15" />
    </linearGradient>

    <!-- Drop Shadows & Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes floatParticle {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
      50% { transform: translateY(-12px) translateX(6px); opacity: 0.8; }
      100% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
    }
    @keyframes pulseDot {
      0% { r: 3px; opacity: 0.5; }
      50% { r: 5px; opacity: 1; }
      100% { r: 3px; opacity: 0.5; }
    }
    .p1 { animation: floatParticle 5s ease-in-out infinite; }
    .p2 { animation: floatParticle 7s ease-in-out infinite 1s; }
    .p3 { animation: floatParticle 6s ease-in-out infinite 2s; }
    .p4 { animation: floatParticle 8s ease-in-out infinite 1.5s; }
    .status-dot { animation: pulseDot 2s infinite ease-in-out; }
  </style>

  <!-- Card Background -->
  <rect x="2" y="2" width="896" height="236" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.8" />

  <!-- Subtle Cyber Tech Grid Pattern -->
  <g opacity="0.07" stroke="#38BDF8" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="240" />
    <line x1="250" y1="0" x2="250" y2="240" />
    <line x1="400" y1="0" x2="400" y2="240" />
    <line x1="550" y1="0" x2="550" y2="240" />
    <line x1="700" y1="0" x2="700" y2="240" />
    <line x1="850" y1="0" x2="850" y2="240" />
    <line x1="0" y1="60" x2="900" y2="60" />
    <line x1="0" y1="120" x2="900" y2="120" />
    <line x1="0" y1="180" x2="900" y2="180" />
  </g>

  <!-- Ambient Radial Light Beams -->
  <circle cx="150" cy="50" r="120" fill="#00F5FF" opacity="0.04" filter="url(#glow)" />
  <circle cx="750" cy="70" r="140" fill="#8B5CF6" opacity="0.05" filter="url(#glow)" />

  <!-- Animated Floating Cyber Particles -->
  <circle class="p1" cx="120" cy="80" r="2.5" fill="#00F5FF" />
  <circle class="p2" cx="280" cy="45" r="3" fill="#818CF8" />
  <circle class="p3" cx="620" cy="75" r="2.5" fill="#EC4899" />
  <circle class="p4" cx="780" cy="50" r="3" fill="#00FF9D" />
  <circle class="p2" cx="450" cy="35" r="2" fill="#38BDF8" />

  <!-- Animated Background Wave 2 -->
  <path fill="url(#wave2Grad)" d="M0,175 C150,155 300,195 450,170 C600,145 750,190 900,165 L900,240 L0,240 Z">
    <animate attributeName="d" 
      values="
        M0,175 C150,155 300,195 450,170 C600,145 750,190 900,165 L900,240 L0,240 Z;
        M0,165 C150,190 300,155 450,185 C600,160 750,175 900,180 L900,240 L0,240 Z;
        M0,175 C150,155 300,195 450,170 C600,145 750,190 900,165 L900,240 L0,240 Z
      " 
      dur="10s" repeatCount="indefinite" />
  </path>

  <!-- Animated Foreground Wave 1 -->
  <path fill="url(#wave1Grad)" d="M0,185 C200,165 350,205 500,180 C650,155 800,195 900,185 L900,240 L0,240 Z">
    <animate attributeName="d" 
      values="
        M0,185 C200,165 350,205 500,180 C650,155 800,195 900,185 L900,240 L0,240 Z;
        M0,180 C200,205 350,165 500,195 C650,175 800,165 900,175 L900,240 L0,240 Z;
        M0,185 C200,165 350,205 500,180 C650,155 800,195 900,185 L900,240 L0,240 Z
      " 
      dur="7s" repeatCount="indefinite" />
  </path>

  <!-- Top Pill Tag: Status / Branding -->
  <g transform="translate(325, 26)">
    <rect x="0" y="0" width="250" height="24" rx="12" fill="#0d1829" stroke="#1e293b" stroke-width="1" />
    <circle class="status-dot" cx="16" cy="12" r="3.5" fill="#10B981" />
    <text x="32" y="16" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="11" font-weight="700" fill="#38BDF8" letter-spacing="1.5">VISTARATECH LABS • 2026</text>
  </g>

  <!-- Main Animated Hero Title -->
  <text x="450" y="98" text-anchor="middle" font-family="'Montserrat', 'Segoe UI', -apple-system, sans-serif" font-size="38" font-weight="900" fill="url(#neonTitle)" letter-spacing="2" filter="url(#softGlow)">
    YOHESH | VISTARATECH
  </text>

  <!-- Subtitle Line -->
  <text x="450" y="132" text-anchor="middle" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="15" font-weight="500" fill="#94A3B8" letter-spacing="1">
    Full Stack Architecture  •  Hardware &amp; Robotics  •  5G BVLOS UAV  •  Spatial AR/VR
  </text>

  <!-- Flagship System Chips -->
  <g transform="translate(195, 156)">
    <!-- Chip 1: PrintBox -->
    <rect x="0" y="0" width="118" height="26" rx="6" fill="#0d1829" stroke="#00F5FF" stroke-width="0.8" opacity="0.9" />
    <text x="59" y="17" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#00F5FF">🖨️ PrintBox Pro</text>

    <!-- Chip 2: SuperDrone 5G -->
    <rect x="130" y="0" width="128" height="26" rx="6" fill="#0d1829" stroke="#FF60A8" stroke-width="0.8" opacity="0.9" />
    <text x="194" y="17" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#FF60A8">🛸 SuperDrone 5G</text>

    <!-- Chip 3: Rodeway AR -->
    <rect x="270" y="0" width="116" height="26" rx="6" fill="#0d1829" stroke="#00FF9D" stroke-width="0.8" opacity="0.9" />
    <text x="328" y="17" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#00FF9D">📱 Rodeway AR</text>

    <!-- Chip 4: Easy Records -->
    <rect x="398" y="0" width="120" height="26" rx="6" fill="#0d1829" stroke="#A855F7" stroke-width="0.8" opacity="0.9" />
    <text x="458" y="17" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#A855F7">🎓 Easy Records</text>
  </g>
</svg>
