<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="termBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0e131f" />
      <stop offset="100%" stop-color="#080c14" />
    </linearGradient>

    <!-- Animated Neon Title Gradient -->
    <linearGradient id="termGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF">
        <animate attributeName="stop-color" values="#00F5FF; #7928CA; #00FF9D; #00F5FF" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#00FF9D">
        <animate attributeName="stop-color" values="#00FF9D; #00F5FF; #7928CA; #00FF9D" dur="6s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="termBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#30363d" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#00FF9D" stop-opacity="0.8" />
    </linearGradient>

    <filter id="neonBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .cursor { animation: blink 1s infinite; }
  </style>

  <!-- Terminal Window Frame -->
  <rect x="2" y="2" width="896" height="226" rx="12" fill="url(#termBg)" stroke="url(#termBorder)" stroke-width="1.8" />

  <!-- Terminal Titlebar -->
  <path d="M2,14 C2,7.37 7.37,2 14,2 L886,2 C892.63,2 898,7.37 898,14 L898,40 L2,40 Z" fill="#161b26" stroke="#21262d" stroke-width="1" />
  
  <!-- Window Control Buttons (macOS style) -->
  <circle cx="24" cy="21" r="6" fill="#ff5f56" />
  <circle cx="44" cy="21" r="6" fill="#ffbd2e" />
  <circle cx="64" cy="21" r="6" fill="#27c93f" />

  <!-- Titlebar Text -->
  <text x="450" y="26" text-anchor="middle" font-family="'Fira Code', 'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="600" fill="#8b949e">
    yohesh@vistara-station: ~ (zsh - 120x34)
  </text>

  <!-- Status Chip -->
  <rect x="760" y="11" width="118" height="20" rx="10" fill="#0d1f18" stroke="#00FF9D" stroke-width="0.8" />
  <circle cx="774" cy="21" r="3.5" fill="#00FF9D" />
  <text x="784" y="25" font-family="'Fira Code', monospace" font-size="10" font-weight="700" fill="#00FF9D">ONLINE :: LAB</text>

  <!-- Terminal Session Content -->
  <!-- Line 1: Command -->
  <text x="28" y="72" font-family="'Fira Code', 'Courier New', monospace" font-size="14" font-weight="700" fill="#00FF9D">
    guest@vistara:~$
    <tspan fill="#ffffff" font-weight="600"> ./init_profile.sh --verbose --developer=yohesh</tspan>
  </text>

  <!-- Line 2: Output ASCII / Banner Name -->
  <text x="28" y="115" font-family="'Fira Code', 'Montserrat', monospace" font-size="28" font-weight="900" fill="url(#termGlow)" filter="url(#neonBlur)" letter-spacing="3">
    YOHESH :: VISTARATECH LABS
  </text>

  <!-- Line 3: System Details -->
  <text x="28" y="148" font-family="'Fira Code', monospace" font-size="13" font-weight="500" fill="#7dd3fc">
    [KERNEL] Full-Stack SaaS  |  5G BVLOS UAV Teleoperation  |  Hardware &amp; Robotics  |  AR/VR
  </text>

  <!-- Line 4: Active Modules -->
  <text x="28" y="178" font-family="'Fira Code', monospace" font-size="12" font-weight="500" fill="#94a3b8">
    [MODULES] PrintBox Pro (Kiosk)  •  SuperDrone 5G  •  Rodeway AR (BLE)  •  Easy Records v2.1
  </text>

  <!-- Line 5: Prompt Waiting -->
  <text x="28" y="208" font-family="'Fira Code', monospace" font-size="13" font-weight="700" fill="#00FF9D">
    yohesh@vistara-station:~$ <tspan fill="#38bdf8">portfolio --display-all</tspan>
    <tspan class="cursor" fill="#00FF9D"> █</tspan>
  </text>
</svg>
