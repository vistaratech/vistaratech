<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 90" width="100%" height="100%">
  <defs>
    <linearGradient id="footerWave1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="footerWave2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.15" />
      <stop offset="50%" stop-color="#EC4899" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#00FF9D" stop-opacity="0.15" />
    </linearGradient>
  </defs>

  <!-- Wave 2 -->
  <path fill="url(#footerWave2)" d="M0,45 C150,25 300,65 450,40 C600,15 750,60 900,35 L900,90 L0,90 Z">
    <animate attributeName="d" 
      values="
        M0,45 C150,25 300,65 450,40 C600,15 750,60 900,35 L900,90 L0,90 Z;
        M0,35 C150,60 300,25 450,55 C600,30 750,45 900,50 L900,90 L0,90 Z;
        M0,45 C150,25 300,65 450,40 C600,15 750,60 900,35 L900,90 L0,90 Z
      " 
      dur="10s" repeatCount="indefinite" />
  </path>

  <!-- Wave 1 -->
  <path fill="url(#footerWave1)" d="M0,55 C200,35 350,75 500,50 C650,25 800,65 900,55 L900,90 L0,90 Z">
    <animate attributeName="d" 
      values="
        M0,55 C200,35 350,75 500,50 C650,25 800,65 900,55 L900,90 L0,90 Z;
        M0,50 C200,75 350,35 500,65 C650,45 800,35 900,45 L900,90 L0,90 Z;
        M0,55 C200,35 350,75 500,50 C650,25 800,65 900,55 L900,90 L0,90 Z
      " 
      dur="7s" repeatCount="indefinite" />
  </path>
</svg>
